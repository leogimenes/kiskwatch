[package]
name = "kiskwatch-core"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kiskwatch's game-independent core: packet framing and decoders, schedules, pet progress"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

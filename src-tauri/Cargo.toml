[package]
name = "kiskwatch"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kiskwatch: overlay and panel to follow your AION 2 characters"

[lib]
name = "kiskwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kiskwatch-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
chrono = "0.4"
chrono-tz = "0.10"
libloading = "0.8"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
